plugins {
  // Apply the java-library plugin for API and implementation separation.
  id 'java-library'
  id 'antlr'
  id 'maven-publish'
  id 'signing'
  id 'jacoco'
  id 'com.adarshr.test-logger' version '3.2.0'
  id 'org.jreleaser' version '1.19.0'
}

group = 'io.github.douira'
version = '3.0.0-pre3'

repositories {
  // Use Maven Central for resolving dependencies.
  mavenCentral()
}

def antlrVersion = '4.13.1'

dependencies {
  antlr group: 'org.antlr', name: 'antlr4', version: antlrVersion
  api group: 'org.antlr', name: 'antlr4-runtime', version: antlrVersion

  testImplementation group: 'io.github.origin-energy', name:'java-snapshot-testing-junit5', version: '4.+'
  testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.+'
  testImplementation group: 'org.fusesource.jansi', name:'jansi', version:'2.4.0'

  testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

generateGrammarSource {
  maxHeapSize = '128m'
  arguments += ['-package', 'io.github.douira.glsl_transformer', '-visitor']
  outputDirectory = new File("${buildDir}/generated-src/antlr/main/io/github/douira/glsl_transformer/")
}

test {
  useJUnitPlatform()

  // report is always generated after tests run
  finalizedBy jacocoTestReport
  testLogging.showStandardStreams = true
  maxParallelForks = System.getenv('CI') ? 1 : Runtime.runtime.availableProcessors() / 2
  outputs.upToDateWhen { false }
}

testlogger {
  theme = 'standard-parallel'
  slowThreshold = 5000
  showSimpleNames = true
  showPassed = false
}

jacocoTestReport {
  // tests are required to run before generating the report
  dependsOn test
  reports {
    xml.required = true
    html.required = true
  }

  // doesn't actually seem to exclude the files
  afterEvaluate {
    classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
        '**/GLSLParser*.java',
        '**/GLSLLexer*.java'
      ])
    }))
  }
}

clean {
  delete 'generated-src'
}

java {
  withJavadocJar()
  withSourcesJar()
}

sourcesJar.dependsOn generateGrammarSource
compileJava.dependsOn generateGrammarSource

jreleaser {
  gitRootSearch = true
  signing {
    active = 'ALWAYS'
  }
  deploy {
    maven {
      mavenCentral {
        sonatype {
          active = 'ALWAYS'
          url = 'https://central.sonatype.com/api/v1/publisher'
          stagingRepository('build/staging-deploy')
        }
      }
    }
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      groupId = 'io.github.douira'
      artifactId = 'glsl-transformer'

      from components.java
      
      pom {
        name = 'glsl-transformer'
        description = 'A GLSL parser and transformer based on ANTLR4'
        url = 'https://github.com/IrisShaders/glsl-transformer'
        licenses {
          license {
            name = 'GNU Affero General Public License v3.0'
            url = 'https://www.gnu.org/licenses/agpl-3.0.en.html'
          }
        }
        developers {
          developer {
            name = 'douira'
            email = 'douira100@gmail.com'
            url = 'https://douira.dev'
          }
        }
        scm {
          connection = 'scm:git:git://github.com/IrisShaders/glsl-transformer.git'
          developerConnection = 'scm:git:ssh://github.com/IrisShaders/glsl-transformer.git'
          url = 'https://github.com/IrisShaders/glsl-transformer' 
        }
      }
    }
  }

  repositories {
    maven {
      url = layout.buildDirectory.dir('staging-deploy')
    }
  }
}

javadoc {
  configure(options) {
    tags = [
      'implSpec:a:Implementation Requirements:',
      'implNote:a:Implementation Note:',
      'apiNote:a:API Usage Note:'
    ]
    links = ["https://javadoc.io/doc/org.antlr/antlr4-runtime/${antlrVersion}/".toString()]
  }
  exclude '**/GLSLParser*.java'
  exclude '**/GLSLLexer*.java'
  exclude '**/ast/Type.java'
  exclude '**/org/apache/commons/**'
}
